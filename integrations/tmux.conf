# DevBox tmux configuration
# Catppuccin Mocha palette · rounded pills · top status bar · "Crafted by GoodieHART" marker
# Requires a Nerd Font in your terminal emulator for the rounded glyphs (U+E0B4/E0B6).
# Without one, replace / with the powerline arrows /.

# --- True color & general ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on

# --- Status bar (top header) ---
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# --- Catppuccin Mocha palette ---
# base #1e1e2e · mantle #181825 · crust #11111b
# text #cdd6f4 · subtext #a6adc8
# surface0 #313244 · surface1 #45475a · surface2 #585b70
# mauve #cba6f7 · blue #89b4fa · pink #f5c2e7 · yellow #f9e2af

set -g status-left-length 30
set -g status-right-length 90

# Left: session name pill
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold]  #S #[fg=#cba6f7,bg=#1e1e2e] "

# Window tabs
setw -g window-status-format "#[fg=#a6adc8,bg=#1e1e2e]  #I  #W  "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold]  #I  #W #[fg=#89b4fa,bg=#1e1e2e]"
setw -g window-status-separator ""

# Right: "Crafted by GoodieHART" pill + clock
set -g status-right "#[fg=#313244,bg=#1e1e2e]#[fg=#f5c2e7,bg=#313244]  Crafted by GoodieHART #[fg=#45475a,bg=#313244]#[fg=#f9e2af,bg=#45475a]  %H:%M #[fg=#1e1e2e,bg=#45475a]"

# --- Panes ---
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# --- Messages & copy mode ---
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
